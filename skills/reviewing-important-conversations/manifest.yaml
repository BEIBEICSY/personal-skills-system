schema_version: 1
id: reviewing-important-conversations
name: Reviewing Important Conversations
version: 0.1.0
category: 个人支持 / 重要沟通复盘
ownership: 个人自制
status: 已收包，可安装
source:
  kind: 本仓库 package
  path: skills/reviewing-important-conversations/package/
  notes: 本仓库为权威来源。更新时先改 package，再运行安装脚本。
installations:
  - host: Cursor
    path: ~/.cursor/skills/reviewing-important-conversations/SKILL.md
    readable: true
    notes: 现有安装来自收包前的本机副本；尚未用本仓库安装脚本覆盖。
compatibility:
  agents:
    - Cursor
  notes: 安装脚本支持 `--host cursor` 与 `--host codex`。
dependencies:
  - type: Skill 文件
    name: templates.md
    location: package/templates.md
  - type: 相关 Skill
    name: reviewing-therapy-transcripts
    location: skills/reviewing-therapy-transcripts/
    notes: 心理咨询场景必须改用该 Skill。不得同时更新两套脉络；用户明确允许且来源确实相关时可以相互引用。
sensitive_boundaries:
  - 不保存录音、截图、聊天导出、转写、复盘产物或关系脉络原文。
  - 未经用户明确提供和允许，不把真实姓名写入本仓库档案。
  - 沟通脉络与心理咨询价值观脉络保持分离；允许在用户明确同意且来源相关时相互引用。
verification:
  last_checked: 2026-09-12
  result: package 与 templates.md 可读，安装脚本测试覆盖该 Skill
  notes: python3 tests/test_install_skill.py -v
restore:
  documented: true
  notes: 克隆本仓库后运行 scripts/install_skill.py reviewing-important-conversations --host cursor。
