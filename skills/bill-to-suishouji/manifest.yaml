schema_version: 1
id: bill-to-suishouji
name: Bill to Suishouji
version: 0.1.0
category: 生活管理 / 个人记账
ownership: 个人自制
status: 已收包，可安装
source:
  kind: 本仓库 package
  path: skills/bill-to-suishouji/package/
  notes: 本仓库为权威来源。旧随手记项目可继续当本地工作台，不再作为规则源。
installations:
  - host: Codex
    path: ~/.codex/skills/bill-to-suishouji/SKILL.md
    readable: true
    notes: 现有安装来自收包前的本机副本；尚未用本仓库安装脚本覆盖。
compatibility:
  agents:
    - Codex
    - Cursor
  notes: 安装脚本支持 `--host cursor` 与 `--host codex`。
dependencies:
  - type: 运行环境
    name: Python 3、openpyxl、LibreOffice soffice
    location: 本机系统；soffice 可用 SUISHOUJI_SOFFICE 覆盖
  - type: 本地工作台
    name: 账单 inputs/outputs/checks
    location: SUISHOUJI_WORKBENCH 或用户指定目录
sensitive_boundaries:
  - 本仓库不保存账单、导入文件或交易明细原文。
  - package 含个人分类、账户昵称和部分卡号后四位映射，仅适合私有仓库。
  - 只记录依赖类型与位置，不记录密钥明文。
verification:
  last_checked: 2026-09-12
  result: package 已收录并去掉本机绝对路径；安装测试覆盖该 Skill
  notes: 本轮未在 package 目录运行原项目完整 unittest。
restore:
  documented: true
  notes: 安装 Skill 包后，另指定本地工作台存放账单。
