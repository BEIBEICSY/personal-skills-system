schema_version: 1
id: reviewing-therapy-transcripts
name: Reviewing Therapy Transcripts
version: 0.2.0
category: 个人支持 / 心理咨询复盘
ownership: 个人自制
status: 已收包，可安装
source:
  kind: 本仓库 package
  path: skills/reviewing-therapy-transcripts/package/
  notes: 本仓库为权威来源。更新时先改 package，再运行安装脚本。
installations:
  - host: Cursor
    path: ~/.cursor/skills/reviewing-therapy-transcripts/SKILL.md
    readable: true
    notes: 现有安装来自收包前的本机副本；尚未用本仓库安装脚本覆盖。
compatibility:
  agents:
    - Cursor
  notes: 安装脚本支持 `--host cursor` 与 `--host codex`。
dependencies:
  - type: 输入
    name: 用户提供的咨询逐字稿
    location: 会话或用户指定的外部工作区
  - type: 相关 Skill
    name: reviewing-important-conversations
    location: skills/reviewing-important-conversations/
    notes: 非心理咨询沟通必须改用该 Skill。不得同时更新两套脉络；用户明确允许且来源确实相关时可以相互引用。
sensitive_boundaries:
  - 不保存逐字稿、咨询笔记原文或其他私人咨询内容。
  - 明确内容、互动观察与工作假设必须分离。
  - 不把工作假设写成诊断或事实。
  - 咨询价值观脉络与沟通脉络保持分离；允许在用户明确同意且来源相关时相互引用，禁止自动复制或合并。
verification:
  last_checked: 2026-09-12
  result: package 可读，安装脚本测试覆盖该 Skill
  notes: python3 tests/test_install_skill.py -v
restore:
  documented: true
  notes: 克隆本仓库后运行 scripts/install_skill.py reviewing-therapy-transcripts --host cursor。
